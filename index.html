<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phòng KHKT</title>
<meta name="theme-color" content="#1f4e79">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phòng KHKT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin:0; height:100%; background:#1f4e79; }
  body { padding-top:env(safe-area-inset-top); box-sizing:border-box; }
  #app { display:block; width:100%; height:100%; border:0; background:#f3f5f8; }
  #cho { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
         background:#1f4e79; color:#fff; font:15px Arial, sans-serif; transition:opacity .3s; }
  #cho img { width:84px; height:84px; border-radius:20px; }
  #cho.an { opacity:0; pointer-events:none; }
  #mat { display:none; position:fixed; left:12px; right:12px; bottom:16px; padding:10px 14px; border-radius:8px; background:#c00000; color:#fff; font:14px Arial, sans-serif; text-align:center; }
</style>
</head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbx3oBqxqWgEJZSfYURLLncDq_YyTo6gqhSnWi0ecgewyGaPv3niY07c4zTG0KVujKk/exec" title="Quản lý công việc Phòng KHKT" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<div id="cho"><img src="icon-192.png" alt=""><div>Đang mở Quản lý công việc Phòng KHKT…</div></div>
<div id="mat">Không có mạng. App sẽ tự tải lại khi có kết nối.</div>
<script>
  var f = document.getElementById('app');
  f.addEventListener('load', function () { document.getElementById('cho').classList.add('an'); });
  setTimeout(function () { document.getElementById('cho').classList.add('an'); }, 15000);
  function mang() { document.getElementById('mat').style.display = navigator.onLine ? 'none' : 'block'; }
  window.addEventListener('offline', mang);
  window.addEventListener('online', function () { mang(); f.src = f.src; });
  mang();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
